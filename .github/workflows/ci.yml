name: CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Tests and Build
      run: ./gradlew :plugin-runtime:test :player-abstraction:test :desktop-app:test :desktop-app:assemble --no-daemon

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          desktop-app/build/reports/tests/
          plugin-runtime/build/reports/tests/
          player-abstraction/build/reports/tests/
