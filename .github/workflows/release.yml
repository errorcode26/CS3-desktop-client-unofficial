name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.2, v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Verify Tag is on Release Branch
      shell: bash
      run: |
        git fetch origin work
        if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/work'; then
          echo "❌ Error: Release tags must be on work branch! Aborting release."
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download and inject libmpv-2.dll (latest build)
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        New-Item -ItemType Directory -Force -Path "desktop-app/appResources/windows/mpv"

        Write-Host "Fetching latest libmpv release from shinchiro/mpv-winbuild-cmake..."
        $headers = @{
          "Accept" = "application/vnd.github.v3+json"
          "User-Agent" = "CloudStream"
        }
        if ($env:GITHUB_TOKEN) {
          $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
        }
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
        $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" } | Select-Object -First 1

        if ($null -eq $asset) {
          Write-Error "Could not find a matching mpv-dev-x86_64-*.7z asset in the latest release!"
          exit 1
        }

        Write-Host "Downloading: $($asset.name) from $($asset.browser_download_url)"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"

        $digestAsset = $release.assets | Where-Object { $_.name -like "$($asset.name)*sha256*" -or $_.name -like "*sha256*sum*" } | Select-Object -First 1
        if ($null -ne $digestAsset) {
            $expectedSha = (Invoke-RestMethod -Uri $digestAsset.browser_download_url -Headers $headers).Trim().Split("`n")[0].Split(" ")[0].Trim().ToLower()
            $actualSha = (Get-FileHash -Path "mpv-dev.7z" -Algorithm SHA256).Hash.ToLower()
            if ($expectedSha.Length -eq 64 -and $expectedSha -ne $actualSha) {
                Write-Error "SHA256 mismatch for mpv-dev.7z! Expected $expectedSha but got $actualSha"
                exit 1
            }
            Write-Host "Verified mpv-dev.7z SHA-256: $actualSha"
        }
        7z e mpv-dev.7z "libmpv-2.dll" -o"desktop-app/appResources/windows/mpv" -r

        if (-not (Test-Path "desktop-app/appResources/windows/mpv/libmpv-2.dll")) {
          Write-Error "libmpv-2.dll was not extracted! The release asset structure may have changed."
          exit 1
        }
        Write-Host "libmpv-2.dll ready."

    - name: Build App (createDistributable and packageMsi)
      shell: bash
      run: |
        # Extract version from tag (e.g., v0.1.4 -> 0.1.4)
        VERSION=${GITHUB_REF_NAME#v}
        ./gradlew :desktop-app:createDistributable :desktop-app:packageMsi :desktop-app:packagePortableZip -PAPP_VERSION=$VERSION --no-daemon

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"

    - name: Generate SHA-256 Checksums
      shell: pwsh
      run: |
        $checksumFile = "desktop-app/build/outputs/checksums.txt"
        $filesToHash = @()
        if (Test-Path "desktop-app/build/outputs/CloudStream-Setup.exe") {
            $filesToHash += Get-Item "desktop-app/build/outputs/CloudStream-Setup.exe"
        }
        $filesToHash += Get-ChildItem -Path "desktop-app/build/outputs" -Filter "CloudStream-Portable-*.zip" -ErrorAction SilentlyContinue
        $filesToHash += Get-ChildItem -Path "desktop-app/build/compose/binaries/main/msi" -Filter "*.msi" -ErrorAction SilentlyContinue

        $lines = @()
        foreach ($file in $filesToHash) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $($file.Name)"
            Write-Host $line
            $lines += $line
        }
        $lines | Out-File -FilePath $checksumFile -Encoding ascii
        Write-Host "Generated checksums.txt with $($lines.Count) entries."

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          desktop-app/build/outputs/CloudStream-Setup.exe
          desktop-app/build/outputs/CloudStream-Portable-*.zip
          desktop-app/build/compose/binaries/main/msi/*.msi
          desktop-app/build/outputs/checksums.txt
        generate_release_notes: true
        prerelease: false
        make_latest: true
